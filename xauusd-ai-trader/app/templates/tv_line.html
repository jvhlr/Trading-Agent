<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingView Lightweight Charts</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #0D1117;
            overflow: hidden;
        }
        #chart-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="chart-container"></div>

    <script>
        const chartOptions = { 
            layout: { 
                textColor: '#90A0B7', 
                background: { type: 'solid', color: '#0D1117' } 
            },
            grid: {
                vertLines: { color: 'rgba(144, 160, 183, 0.1)' },
                horzLines: { color: 'rgba(144, 160, 183, 0.1)' }
            },
            rightPriceScale: {
                borderVisible: false,
            },
            timeScale: {
                borderVisible: false,
                timeVisible: true,
                tickMarkFormatter: (time, tickMarkType, locale) => {
                    return String(time);
                }
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
            }
        };
        
        const chart = LightweightCharts.createChart(document.getElementById('chart-container'), chartOptions);
        
        const lineSeries = chart.addLineSeries({ 
            color: '#00E5FF', 
            lineWidth: 2,
            crosshairMarkerVisible: true,
            crosshairMarkerRadius: 4,
        });

        // Make chart responsive
        new ResizeObserver(entries => {
            if (entries.length === 0 || entries[0].target !== document.getElementById('chart-container')) { return; }
            const newRect = entries[0].contentRect;
            chart.applyOptions({ height: newRect.height, width: newRect.width });
        }).observe(document.getElementById('chart-container'));

        /**
         * Python will call this function to inject data.
         * data format: [ {time: 1, value: 10000}, {time: 2, value: 10100}, ... ]
         */
        function updateData(data) {
            lineSeries.setData(data);
            chart.timeScale().fitContent();
        }
    </script>
</body>
</html>
