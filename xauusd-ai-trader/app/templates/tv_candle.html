<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingView Candlestick Chart</title>
    <script src="lightweight-charts.standalone.production.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #0D1117;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #chart-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="chart-container"></div>

    <script>
        let chart = null;
        let candleSeries = null;
        const overlays = {};

        function initChart() {
            const container = document.getElementById('chart-container');
            const chartOptions = { 
                layout: { 
                    textColor: '#90A0B7', 
                    background: { type: 'solid', color: '#0D1117' } 
                },
                grid: {
                    vertLines: { color: 'rgba(144, 160, 183, 0.08)' },
                    horzLines: { color: 'rgba(144, 160, 183, 0.08)' }
                },
                rightPriceScale: {
                    borderVisible: false,
                    scaleMargins: {
                        top: 0.1,
                        bottom: 0.1,
                    },
                },
                timeScale: {
                    borderVisible: false,
                    timeVisible: true,
                    secondsVisible: false,
                    rightOffset: 12,
                },
                crosshair: {
                    mode: 1, // CrosshairMode Normal
                }
            };
            
            chart = LightweightCharts.createChart(container, chartOptions);
            
            const candleOptions = { 
                upColor: '#00E676', 
                downColor: '#FF5252', 
                borderVisible: false,
                wickUpColor: '#00E676', 
                wickDownColor: '#FF5252', 
            };

            if (typeof chart.addCandlestickSeries === 'function') {
                candleSeries = chart.addCandlestickSeries(candleOptions);
            } else if (LightweightCharts.CandlestickSeries) {
                candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, candleOptions);
            }

            // Make chart responsive
            new ResizeObserver(entries => {
                if (!entries.length || entries[0].target !== container) return;
                const rect = entries[0].contentRect;
                if (rect.width > 0 && rect.height > 0) {
                    chart.applyOptions({ height: rect.height, width: rect.width });
                }
            }).observe(container);
        }

        function createLineSeries(config) {
            const lineOptions = {
                color: config.color || '#00E5FF',
                lineWidth: config.width || 2,
                lineStyle: config.style || 0, // 0 Solid, 1 Dotted, 2 Dashed
                crosshairMarkerVisible: false,
            };

            if (typeof chart.addLineSeries === 'function') {
                return chart.addLineSeries(lineOptions);
            } else if (LightweightCharts.LineSeries) {
                return chart.addSeries(LightweightCharts.LineSeries, lineOptions);
            }
            return null;
        }

        /**
         * data format: {
         *   candles: [ {time, open, high, low, close}, ... ],
         *   lines: [
         *      { name: "sma20", color: "#FFD700", data: [ {time, value}, ... ] },
         *      ...
         *   ]
         * }
         */
        function updateData(payload) {
            try {
                if (!chart) {
                    initChart();
                }

                if (payload && payload.candles && candleSeries) {
                    candleSeries.setData(payload.candles);
                }
                
                if (payload && payload.lines) {
                    payload.lines.forEach(lineConfig => {
                        if (!overlays[lineConfig.name]) {
                            const series = createLineSeries(lineConfig);
                            if (series) {
                                overlays[lineConfig.name] = series;
                            }
                        }
                        if (overlays[lineConfig.name] && lineConfig.data) {
                            overlays[lineConfig.name].setData(lineConfig.data);
                        }
                    });
                }
                
                if (chart) {
                    chart.timeScale().fitContent();
                }
            } catch (err) {
                console.error("updateData error:", err);
            }
        }

        // Initialize on DOM load
        document.addEventListener('DOMContentLoaded', () => {
            initChart();
        });
    </script>
</body>
</html>
